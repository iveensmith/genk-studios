<!doctype html>
<!--

-->
<html lang="en">

<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { display: flex; align-items: center; justify-content: center; background: #0c0d0f; }
  svg { width: 300px; height: 300px; display: block; }
  path {
    fill: none;
    stroke: #e5813f;
    stroke-width: 2.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
