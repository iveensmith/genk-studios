<!doctype html>
<!--
  Generator for the Open Graph cards (public/og*.png, 1200×630). Not shipped;
  kept in scripts/ for regeneration. Run `node scripts/og-generate.mjs` with the
  dev server up; it copies this file into public/, shoots each card with headless
  Chrome and cleans up. Params: title, cat, desc, slug (project cards) or
  eyebrow, tag, url, mode=home (site default). title accepts %0A for a line break.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(120% 90% at 12% 8%, rgba(229,129,63,0.20), transparent 55%),
      radial-gradient(90% 80% at 96% 108%, rgba(242,149,90,0.07), transparent 60%),
      #0c0d0f;
    color: #eceef1;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .flourish { position: absolute; top: -96px; right: -70px; width: 380px; }
  .flourish path { fill: none; stroke: rgba(229,129,63,0.13); stroke-width: 2; stroke-linecap: round; }
  .frame { position: absolute; inset: 0; padding: 70px 80px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  .brand { position: absolute; top: 64px; left: 80px; display: flex; align-items: center; gap: 14px; }
  .mark { width: 40px; height: 40px; color: #e5813f; }
  .mark svg { display: block; width: 100%; height: 100%; }
  .brand span { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; }
  .brand .dim { color: #9b9ea6; }
  .eyebrow {
    display: flex; align-items: center; gap: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase; color: #9b9ea6;
    margin-bottom: 22px;
  }
  .eyebrow::before { content: ''; width: 54px; height: 1px; background: #e5813f; }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700; font-size: 82px; line-height: 1.02;
    letter-spacing: -0.038em; margin-bottom: 22px;
    white-space: pre-line;
  }
  .desc { max-width: 34ch; color: #b6b8be; font-size: 24px; line-height: 1.5; }
  .foot {
    position: absolute; left: 80px; right: 80px; bottom: 62px;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 24px; border-top: 1px solid rgba(236,238,241,0.12);
  }
  .foot::before { content: ''; position: absolute; top: -1px; left: 0; width: 72px; height: 1px; background: #e5813f; }
  .foot .tag, .foot .url {
    font-family: 'Space Mono', monospace; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .foot .tag { color: #6f727a; }
  .foot .url { color: #e5813f; letter-spacing: 0.04em; text-transform: none; }
</style>
</head>
<body>
  <svg class="flourish" viewBox="0 0 260 300" fill="none">
    <path d="M40 12c80 10 120 82 70 142-40 50-118 32-106-48 8-56 78-70 104-26 20 34-6 78-40 66" />
    <path d="M170 60c-100-12-140 72-98 132 34 48 112 40 110-40-2-52-52-74-78-24" />
  </svg>
  <div class="frame">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 28 28" fill="none"><path d="M19.9 9.1a6.6 6.6 0 1 0 1.4 6.1h-5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </span>
      <span>Genk <span class="dim">Studios</span></span>
    </div>
    <div>
      <div class="eyebrow" id="eyebrow">Case study</div>
      <h1 id="title">Project</h1>
      <p class="desc" id="desc"></p>
    </div>
    <div class="foot">
      <div class="tag" id="tag">Case study</div>
      <div class="url" id="url">genkstudios.netlify.app</div>
    </div>
  </div>
  <script>
    const p = new URLSearchParams(location.search)
    const cat = p.get('cat') || ''
    const home = p.get('mode') === 'home'
    document.getElementById('eyebrow').textContent =
      p.get('eyebrow') || (home ? 'Digital product studio' : cat ? 'Case study · ' + cat : 'Case study')
    document.getElementById('title').textContent = p.get('title') || 'Project'
    document.getElementById('desc').textContent = p.get('desc') || ''
    document.getElementById('tag').textContent = p.get('tag') || cat || 'Case study'
    document.getElementById('url').textContent =
      p.get('url') || 'genkstudios.netlify.app/work/' + (p.get('slug') || '')
  </script>
</body>
</html>
